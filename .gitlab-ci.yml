# DeepSeek Harness Desktop — GitLab CI/CD
#
# 用法：
#   git tag v0.1.0 && git push origin v0.1.0
# → test → 各端 build → Generic Package + GitLab Release
#
# 变量（Settings → CI/CD → Variables，可选）：
#   ENABLE_WIN_BUILD=1 / ENABLE_MAC_BUILD=1  — 手动流水线强制启用
#   ENABLE_WIN_BUILD=0 / ENABLE_MAC_BUILD=0  — tag 流水线跳过（默认 tag 会尝试，无 runner 则 allow_failure）
#
# Runner：
#   Linux — shared runner
#   Windows / macOS — 自备 runner，并打 tags: windows / macos

# 打包优先级：Windows → macOS → Linux（串行，前一失败则后续不跑）
stages:
  - test
  - build-win
  - build-mac
  - build-linux
  - release

variables:
  PNPM_VERSION: '11'
  NODE_VERSION: '24'
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'
  PACKAGE_NAME: dsh-desktop

.pnpm_linux:
  image: node:${NODE_VERSION}-bookworm
  before_script:
    - corepack enable
    - corepack prepare pnpm@${PNPM_VERSION} --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store

test:
  extends: .pnpm_linux
  stage: test
  script:
    - pnpm test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

build:windows:
  stage: build-win
  needs: [test]
  tags: [windows]
  variables:
    CSC_IDENTITY_AUTO_DISCOVERY: 'false'
  before_script:
    - corepack enable
    - corepack prepare "pnpm@$env:PNPM_VERSION" --activate
    - pnpm install --frozen-lockfile
  script:
    - pnpm dist:win
  artifacts:
    name: ${PACKAGE_NAME}-win-${CI_COMMIT_REF_SLUG}
    paths:
      - release/
    expire_in: 14 days
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/ && $ENABLE_WIN_BUILD != "0"
    - if: $CI_PIPELINE_SOURCE == "web" && $ENABLE_WIN_BUILD == "1"
    - when: never
  allow_failure: true

build:macos:
  stage: build-mac
  needs:
    - job: test
    - job: build:windows
      optional: true
  tags: [macos]
  variables:
    CSC_IDENTITY_AUTO_DISCOVERY: 'false'
  before_script:
    - corepack enable
    - corepack prepare pnpm@${PNPM_VERSION} --activate
    - pnpm install --frozen-lockfile
  script:
    - pnpm dist:mac
  artifacts:
    name: ${PACKAGE_NAME}-mac-${CI_COMMIT_REF_SLUG}
    paths:
      - release/
    expire_in: 14 days
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/ && $ENABLE_MAC_BUILD != "0"
    - if: $CI_PIPELINE_SOURCE == "web" && $ENABLE_MAC_BUILD == "1"
    - when: never
  allow_failure: true

build:linux:
  extends: .pnpm_linux
  stage: build-linux
  needs:
    - job: test
    - job: build:windows
      optional: true
    - job: build:macos
      optional: true
  script:
    - pnpm dist:linux
  artifacts:
    name: ${PACKAGE_NAME}-linux-${CI_COMMIT_REF_SLUG}
    paths:
      - release/
    expire_in: 14 days
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_BRANCH && $ENABLE_LINUX_BUILD == "1"

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: build:linux
      artifacts: true
    - job: build:windows
      artifacts: true
      optional: true
    - job: build:macos
      artifacts: true
      optional: true
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  before_script:
    - |
      if command -v apk >/dev/null 2>&1; then
        apk add --no-cache curl bash findutils
      else
        apt-get update && apt-get install -y curl bash findutils
      fi
  script:
    - bash scripts/gitlab-publish-release.sh
  artifacts:
    name: ${PACKAGE_NAME}-release-${CI_COMMIT_TAG}
    paths:
      - upload/
    expire_in: 30 days
