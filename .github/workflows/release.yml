name: Release

# 推送 v* tag → Win / mac(arm64) / mac(x64) / Linux 并行打包，再发 GitHub Release
# 只挂安装包；blockmap / latest*.yml 不上传。
# Source code zip/tar.gz 是 GitHub 对每个 Release 自动生成的，无法关闭。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: '打包完成后创建/更新 GitHub Release'
        type: boolean
        default: true
      release_tag:
        description: 'Release tag（如 v0.1.0）；在 tag 上触发时可留空'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  win:
    name: Windows
    uses: ./.github/workflows/build-platform.yml
    with:
      platform: win
      os: windows-latest
      script: dist:win
      artifact_name: dsh-desktop-win
      retention_days: 30

  mac-arm64:
    name: macOS (Apple Silicon)
    uses: ./.github/workflows/build-platform.yml
    with:
      platform: mac-arm64
      os: macos-latest
      script: dist:mac:arm64
      artifact_name: dsh-desktop-mac-arm64
      retention_days: 30

  mac-x64:
    name: macOS (Intel)
    uses: ./.github/workflows/build-platform.yml
    with:
      platform: mac-x64
      # macos-13 已退役；macos-15-intel 是标准 runner 上的 Intel x64 替代
      os: macos-15-intel
      script: dist:mac:x64
      artifact_name: dsh-desktop-mac-x64
      retention_days: 30

  linux:
    name: Linux
    uses: ./.github/workflows/build-platform.yml
    with:
      platform: linux
      os: ubuntu-22.04
      script: dist:linux
      artifact_name: dsh-desktop-linux
      retention_days: 30

  publish:
    name: Publish GitHub Release
    needs: [win, mac-arm64, mac-x64, linux]
    runs-on: ubuntu-latest
    if: >
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download available platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          pattern: dsh-desktop-*
          merge-multiple: true

      - name: Collect release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upload
          # 只收集安装包
          find dist-artifacts -type f \( \
            -name 'dsh-desktop-*.exe' -o \
            -name 'dsh-desktop-*.zip' -o \
            -name 'dsh-desktop-*.dmg' -o \
            -name 'dsh-desktop-*.AppImage' -o \
            -name 'dsh-desktop-*.deb' \
          \) -exec cp -v {} upload/ \;
          echo "Files to publish:"
          find upload -type f | sort
          count=$(find upload -type f | wc -l)
          if [ "$count" -lt 1 ]; then
            echo "没有可发布的产物" >&2
            exit 1
          fi

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ inputs.release_tag }}" ]]; then
            echo "name=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "缺少 release tag：请在 v* tag 上触发，或填写 release_tag" >&2
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: DeepSeek Harness Desktop ${{ steps.tag.outputs.name }}
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.name, '-') }}
          generate_release_notes: true
          files: upload/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
