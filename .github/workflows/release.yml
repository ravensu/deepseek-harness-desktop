name: Release

# 推送 v* tag → 三端打包并发布 GitHub Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: '打包完成后创建/更新 GitHub Release'
        type: boolean
        default: true
      release_tag:
        description: 'Release tag（如 v0.1.0）；在 tag 上触发时可留空'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            script: dist:win
          - os: macos-latest
            platform: mac
            script: dist:mac
          - os: ubuntu-22.04
            platform: linux
            script: dist:linux

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            .cache/electron
            .cache/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'package.json') }}
          restore-keys: |
            electron-${{ runner.os }}-

      - name: Install Linux packaging deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfuse2 \
            fakeroot \
            dpkg \
            rpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build ${{ matrix.platform }}
        shell: bash
        run: |
          set -o pipefail
          pnpm ${{ matrix.script }} 2>&1 | tee "${RUNNER_TEMP}/dsh-build.log"

      - name: Surface build failure
        if: failure()
        shell: bash
        run: |
          log="${RUNNER_TEMP}/dsh-build.log"
          {
            echo "## Build failure (${{ matrix.platform }})"
            echo
            echo '```'
            if [ -f "$log" ]; then tail -n 120 "$log"; else echo "(no build log)"; fi
            echo '```'
            echo
            echo '### release/'
            echo '```'
            find release -maxdepth 3 \( -type f -o -type d \) 2>/dev/null | sort || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$log" ]; then
            grep -E '⨯|Error:|ELIFECYCLE|ENOENT|Cannot find|missing|afterPack:|pack smoke:|stage-node:' "$log" \
              | tail -n 30 \
              | while IFS= read -r line; do
                  echo "::error::${line}"
                done
          fi

      - name: Verify release artifacts
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::release tree"
          find release -maxdepth 2 -type f | sort || true
          echo "::endgroup::"
          if ! find release -maxdepth 1 -type f -name 'dsh-desktop-*' | grep -q .; then
            echo "release/ 下没有 dsh-desktop-* 安装包" >&2
            exit 1
          fi

      - name: Upload ${{ matrix.platform }} artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-${{ matrix.platform }}
          path: |
            release/dsh-desktop-*.*
            release/latest*.yml
            release/*.blockmap
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: >
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          pattern: dsh-desktop-*
          merge-multiple: true

      - name: Collect release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upload
          find dist-artifacts -type f \
            \( -name 'dsh-desktop-*' -o -name 'latest*.yml' -o -name '*.blockmap' \) \
            -exec cp -v {} upload/ \;
          echo "Files to publish:"
          find upload -type f | sort
          count=$(find upload -type f | wc -l)
          if [ "$count" -lt 1 ]; then
            echo "没有可发布的产物" >&2
            exit 1
          fi

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ inputs.release_tag }}" ]]; then
            echo "name=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "缺少 release tag：请在 v* tag 上触发，或填写 release_tag" >&2
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: DeepSeek Harness Desktop ${{ steps.tag.outputs.name }}
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.name, '-') }}
          generate_release_notes: true
          files: upload/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
