name: Package

# 手动或相关变更推到 main → Win / mac(arm64) / mac(x64) / Linux 并行打包（仅 Artifact）
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/package.yml'
      - '.github/workflows/build-platform.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'electron-builder.yml'
      - 'src/**'
      - 'plugins/**'
      - 'scripts/**'

permissions:
  contents: read

concurrency:
  group: package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  win:
    name: Windows
    uses: ./.github/workflows/build-platform.yml
    with:
      platform: win
      os: windows-latest
      script: dist:win
      artifact_name: dsh-desktop-win-${{ github.sha }}
      retention_days: 14

  mac-arm64:
    name: macOS (Apple Silicon)
    uses: ./.github/workflows/build-platform.yml
    with:
      platform: mac-arm64
      os: macos-latest
      script: dist:mac:arm64
      artifact_name: dsh-desktop-mac-arm64-${{ github.sha }}
      retention_days: 14

  mac-x64:
    name: macOS (Intel)
    uses: ./.github/workflows/build-platform.yml
    with:
      platform: mac-x64
      # macos-13 已退役；macos-15-intel 是标准 runner 上的 Intel x64 替代
      os: macos-15-intel
      script: dist:mac:x64
      artifact_name: dsh-desktop-mac-x64-${{ github.sha }}
      retention_days: 14

  linux:
    name: Linux
    uses: ./.github/workflows/build-platform.yml
    with:
      platform: linux
      os: ubuntu-22.04
      script: dist:linux
      artifact_name: dsh-desktop-linux-${{ github.sha }}
      retention_days: 14

  # 四端打包成功后自动打下一个 v* patch tag 并推送；
  # tag 触发 release.yml 完成正式 GitHub Release（含 latest*.yml / electron-updater）。
  # release.yml 自身不打 tag，不会循环。
  tag-release:
    name: Tag next release
    needs: [win, mac-arm64, mac-x64, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute and push next patch tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin --tags --force
          # 幂等：当前 commit 已发过正式版就直接复用，重跑不再发新版
          existing=$(git tag -l 'v*' --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          if [ -n "${existing}" ]; then
            echo "HEAD 已有正式 tag ${existing}，跳过打 tag"
            echo "tag=${existing}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 只认正式版 tag（vX.Y.Z），忽略 -rc 等预发布
          latest=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          if [ -z "${latest}" ]; then
            latest="v0.0.0"
          fi
          base="${latest#v}"
          major="${base%%.*}"
          rest="${base#*.}"
          minor="${rest%%.*}"
          patch="${rest#*.}"
          next="v${major}.${minor}.$((patch + 1))"
          echo "latest=${latest} next=${next}"
          if git rev-parse -q --verify "refs/tags/${next}" >/dev/null; then
            echo "tag ${next} 已存在，跳过（可能已发过版）"
            echo "tag=${next}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # lightweight tag 不需要 git identity
          git tag "${next}"
          git push origin "${next}"
          echo "tag=${next}" >> "$GITHUB_OUTPUT"
