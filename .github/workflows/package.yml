name: Package

# 手动或相关变更推到 main → 按 Win → mac(arm64) → mac(x64) → Linux 串行打包
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/package.yml'
      - '.github/workflows/build-platform.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'electron-builder.yml'
      - 'src/**'
      - 'plugins/**'
      - 'scripts/**'

permissions:
  contents: read

concurrency:
  group: package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  win:
    name: Windows
    uses: ./.github/workflows/build-platform.yml
    with:
      platform: win
      os: windows-latest
      script: dist:win
      artifact_name: dsh-desktop-win-${{ github.sha }}
      retention_days: 14

  mac-arm64:
    name: macOS (Apple Silicon)
    needs: win
    uses: ./.github/workflows/build-platform.yml
    with:
      platform: mac-arm64
      os: macos-latest
      script: dist:mac:arm64
      artifact_name: dsh-desktop-mac-arm64-${{ github.sha }}
      retention_days: 14

  mac-x64:
    name: macOS (Intel)
    needs: mac-arm64
    uses: ./.github/workflows/build-platform.yml
    with:
      platform: mac-x64
      os: macos-13
      script: dist:mac:x64
      artifact_name: dsh-desktop-mac-x64-${{ github.sha }}
      retention_days: 14

  linux:
    name: Linux
    needs: mac-x64
    uses: ./.github/workflows/build-platform.yml
    with:
      platform: linux
      os: ubuntu-22.04
      script: dist:linux
      artifact_name: dsh-desktop-linux-${{ github.sha }}
      retention_days: 14
