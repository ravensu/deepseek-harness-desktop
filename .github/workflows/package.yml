name: Package

# 手动或推送后打 Win / macOS / Linux 三端产物（上传 Artifact，默认不发 Release）
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/package.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'electron-builder.yml'
      - 'src/**'
      - 'plugins/**'
      - 'scripts/**'

permissions:
  contents: read

concurrency:
  group: package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            script: dist:win
            artifact_glob: |
              release/dsh-desktop-*-win-*.exe
              release/dsh-desktop-*-win-*.zip
              release/*-win-*.blockmap
              release/latest.yml
          - os: macos-latest
            platform: mac
            script: dist:mac
            artifact_glob: |
              release/dsh-desktop-*-mac-*.dmg
              release/dsh-desktop-*-mac-*.zip
              release/*-mac-*.blockmap
              release/latest-mac.yml
          - os: ubuntu-22.04
            platform: linux
            script: dist:linux
            artifact_glob: |
              release/dsh-desktop-*-linux-*.AppImage
              release/dsh-desktop-*-linux-*.deb
              release/dsh-desktop-*-linux-*.zip
              release/*-linux-*.blockmap
              release/latest-linux.yml

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            .cache/electron
            .cache/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'package.json') }}
          restore-keys: |
            electron-${{ runner.os }}-

      - name: Install Linux packaging deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfuse2 \
            fakeroot \
            dpkg \
            rpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build ${{ matrix.platform }}
        run: pnpm ${{ matrix.script }}

      - name: List release outputs
        shell: bash
        run: |
          echo "::group::release/"
          find release -maxdepth 2 -type f | sort || true
          echo "::endgroup::"

      - name: Upload ${{ matrix.platform }} artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-${{ matrix.platform }}-${{ github.sha }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error
          retention-days: 14
