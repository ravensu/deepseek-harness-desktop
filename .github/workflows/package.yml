name: Package

# 手动或相关变更推到 main → 打 Win / macOS / Linux 三端产物（仅 Artifact）
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/package.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'electron-builder.yml'
      - 'src/**'
      - 'plugins/**'
      - 'scripts/**'

permissions:
  contents: read

concurrency:
  group: package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            script: dist:win
          - os: macos-latest
            platform: mac
            script: dist:mac
          - os: ubuntu-22.04
            platform: linux
            script: dist:linux

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            .cache/electron
            .cache/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'package.json') }}
          restore-keys: |
            electron-${{ runner.os }}-

      - name: Install Linux packaging deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfuse2 \
            fakeroot \
            dpkg \
            rpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build ${{ matrix.platform }}
        shell: bash
        run: |
          set -o pipefail
          pnpm ${{ matrix.script }} 2>&1 | tee "${RUNNER_TEMP}/dsh-build.log"

      - name: Surface build failure
        if: failure()
        shell: bash
        run: |
          log="${RUNNER_TEMP}/dsh-build.log"
          {
            echo "## Build failure (${{ matrix.platform }})"
            echo
            echo '```'
            if [ -f "$log" ]; then tail -n 120 "$log"; else echo "(no build log)"; fi
            echo '```'
            echo
            echo '### release/'
            echo '```'
            find release -maxdepth 3 \( -type f -o -type d \) 2>/dev/null | sort || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$log" ]; then
            # 把关键错误打成 annotation，未登录也能在 Summary 旁看到
            grep -E '⨯|Error:|ELIFECYCLE|ENOENT|Cannot find|missing|afterPack:|pack smoke:|stage-node:' "$log" \
              | tail -n 30 \
              | while IFS= read -r line; do
                  echo "::error::${line}"
                done
          fi
          if [ -f release/builder-debug.yml ]; then
            echo "::notice::builder-debug.yml exists"
          fi

      - name: Verify release artifacts
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::release tree"
          find release -maxdepth 2 -type f | sort || true
          echo "::endgroup::"
          if ! find release -maxdepth 1 -type f -name 'dsh-desktop-*' | grep -q .; then
            echo "release/ 下没有 dsh-desktop-* 安装包" >&2
            exit 1
          fi

      - name: Upload ${{ matrix.platform }} artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-${{ matrix.platform }}-${{ github.sha }}
          # 多行 path 必须写在 step 里，不要从 matrix 传入（否则会变成单行空格拼接）
          path: |
            release/dsh-desktop-*.*
            release/latest*.yml
            release/*.blockmap
          if-no-files-found: error
          retention-days: 14
