name: Package

# 手动或相关变更推到 main → 按 Win → mac → Linux 串行打包（仅 Artifact）
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/package.yml'
      - '.github/workflows/build-platform.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'electron-builder.yml'
      - 'src/**'
      - 'plugins/**'
      - 'scripts/**'

permissions:
  contents: read

concurrency:
  group: package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  win:
    name: Windows
    uses: ./.github/workflows/build-platform.yml
    with:
      platform: win
      os: windows-latest
      script: dist:win
      artifact_name: dsh-desktop-win-${{ github.sha }}
      retention_days: 14

  mac:
    name: macOS
    needs: win
    uses: ./.github/workflows/build-platform.yml
    with:
      platform: mac
      os: macos-latest
      script: dist:mac
      artifact_name: dsh-desktop-mac-${{ github.sha }}
      retention_days: 14

  linux:
    name: Linux
    needs: mac
    uses: ./.github/workflows/build-platform.yml
    with:
      platform: linux
      os: ubuntu-22.04
      script: dist:linux
      artifact_name: dsh-desktop-linux-${{ github.sha }}
      retention_days: 14
