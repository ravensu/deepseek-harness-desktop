# 可复用：单端打包（由 Package / Release 按 Win → mac → Linux 串行调用）
name: Build platform

on:
  workflow_call:
    inputs:
      platform:
        description: win | mac | linux
        required: true
        type: string
      os:
        required: true
        type: string
      script:
        required: true
        type: string
      artifact_name:
        required: true
        type: string
      retention_days:
        required: false
        type: number
        default: 14

permissions:
  contents: read

jobs:
  build:
    name: ${{ inputs.platform }}
    runs-on: ${{ inputs.os }}
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            .cache/electron
            .cache/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'package.json') }}
          restore-keys: |
            electron-${{ runner.os }}-

      - name: Install Linux packaging deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfuse2 \
            fakeroot \
            dpkg \
            rpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build ${{ inputs.platform }}
        shell: bash
        run: |
          set -o pipefail
          pnpm ${{ inputs.script }} 2>&1 | tee "${RUNNER_TEMP}/dsh-build.log"

      - name: Surface build failure
        if: failure()
        shell: bash
        run: |
          log="${RUNNER_TEMP}/dsh-build.log"
          {
            echo "## Build failure (${{ inputs.platform }})"
            echo
            echo '```'
            if [ -f "$log" ]; then tail -n 120 "$log"; else echo "(no build log)"; fi
            echo '```'
            echo
            echo '### release/'
            echo '```'
            find release -maxdepth 3 \( -type f -o -type d \) 2>/dev/null | sort || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$log" ]; then
            grep -E '⨯|Error:|ELIFECYCLE|ENOENT|Cannot find|missing|afterPack:|pack smoke:|stage-node:' "$log" \
              | tail -n 30 \
              | while IFS= read -r line; do
                  echo "::error::${line}"
                done
          fi

      - name: Verify release artifacts
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::release tree"
          find release -maxdepth 2 -type f | sort || true
          echo "::endgroup::"
          # 安装包 + electron-updater 元数据（latest*.yml / blockmap）
          packs=()
          while IFS= read -r f; do
            packs+=("$f")
          done < <(find release -maxdepth 1 -type f \( \
            -name 'dsh-desktop-*.exe' -o \
            -name 'dsh-desktop-*.zip' -o \
            -name 'dsh-desktop-*.dmg' -o \
            -name 'dsh-desktop-*.AppImage' -o \
            -name 'dsh-desktop-*.deb' \) | sort)
          if [ "${#packs[@]}" -lt 1 ]; then
            echo "release/ 下没有安装包" >&2
            exit 1
          fi
          printf '%s\n' "${packs[@]}"

      - name: Upload ${{ inputs.platform }} artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: |
            release/dsh-desktop-*.exe
            release/dsh-desktop-*.zip
            release/dsh-desktop-*.dmg
            release/dsh-desktop-*.AppImage
            release/dsh-desktop-*.deb
            release/latest*.yml
            release/*.blockmap
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}
